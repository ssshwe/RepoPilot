[project]
name = "repopilot-api"
version = "0.1.0"
description = "RepoPilot FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "qdrant-client>=1.19.1,<1.20.0",
    "tree-sitter>=0.26.0,<0.27.0",
    "tree-sitter-java>=0.23.5,<0.24.0",
    "tree-sitter-javascript>=0.25.0,<0.26.0",
    "tree-sitter-python>=0.25.0,<0.26.0",
    "tree-sitter-typescript>=0.23.2,<0.24.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires explicit opt-in and a running configured external service"]
