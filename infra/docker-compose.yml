name: repopilot

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The official image has bash but does not include curl/wget.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r response <&3 &&
          [[ "$$response" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  qdrant_storage:
